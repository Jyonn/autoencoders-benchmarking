name: betavae
kind: autoencoder
fit: true
output_representation: ${output_representation:posterior_mean}$
batch_size: ${transform_batch_size:512}$

model:
  name: betavae
  config:
    latent_dim: ${latent_dim:128}$
    beta: ${beta:4.0}$

encoder:
  name: mlp
  config:
    hidden_dims: ${encoder_hidden_dims:384,256}$
    activation: ${activation:relu}$
    use_bias: ${use_bias:true}$

decoder:
  name: mlp
  config:
    hidden_dims: ${decoder_hidden_dims:256,384}$
    activation: ${activation:relu}$
    use_bias: ${use_bias:true}$

trainer:
  epochs: ${epochs:0}$
  patience: ${patience:5}$
  batch_size: ${train_batch_size:256}$
  learning_rate: ${learning_rate:0.001}$
  optimizer_name: ${optimizer_name:adamw}$
  weight_decay: ${weight_decay:0.0}$
  validation_ratio: ${validation_ratio:0.1}$
  test_ratio: ${test_ratio:0.1}$
  device: ${train_device:cpu}$
  seed: ${seed:42}$
