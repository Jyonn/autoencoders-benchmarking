name: pqvae
kind: autoencoder
fit: true
output_representation: ${output_representation:quantized_latents}$
batch_size: ${transform_batch_size:512}$

model:
  name: pqvae
  config:
    latent_dim: ${latent_dim:32}$
    num_codebooks: ${num_codebooks:4}$
    codebook_size: ${codebook_size:256}$
    assignment_strategy: ${assignment_strategy:sinkhorn}$
    sinkhorn_epsilon: ${sinkhorn_epsilon:0.05,0.05,0.05,0.05}$
    sinkhorn_iters: ${sinkhorn_iters:50}$

encoder:
  name: mlp
  config:
    hidden_dims: ${encoder_hidden_dims:256,128,64}$
    activation: ${activation:relu}$
    use_bias: ${use_bias:true}$

trainer:
  epochs: ${epochs:0}$
  patience: ${patience:5}$
  batch_size: ${train_batch_size:256}$
  learning_rate: ${learning_rate:0.001}$
  optimizer_name: ${optimizer_name:adamw}$
  weight_decay: ${weight_decay:0.0}$
  validation_ratio: ${validation_ratio:0.1}$
  test_ratio: ${test_ratio:0.1}$
  device: ${train_device:cpu}$
  seed: ${seed:42}$
