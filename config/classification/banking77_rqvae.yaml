experiment_name: banking77-v2-rqvae-quantized

encoder:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 128
  normalize_embeddings: false

task:
  name: Banking77Classification.v2
  output_dir: results
  eval_splits: ["test"]
  max_fit_samples: 5000

transform:
  kind: autoencoder
  fit: true
  output_representation: quantized_latents
  batch_size: 512
  checkpoint_dir: results/banking77-v2-rqvae-quantized/checkpoint
  model_name: rqvae
  model_config:
    latent_dim: 128
    num_quantizers: 4
    codebook_size: 256
    assignment_strategy: sinkhorn
    sinkhorn_epsilon: [0.05, 0.05, 0.05, 0.05]
    sinkhorn_iters: 50
  encoder_name: mlp
  encoder_config:
    hidden_dims: [384, 256]
    activation: relu
    use_bias: true
  decoder_name: mlp
  decoder_config:
    hidden_dims: [256, 384]
    activation: relu
    use_bias: true
  training_config:
    output_dir: results/banking77-v2-rqvae-quantized/train
    epochs: 0
    patience: 5
    batch_size: 256
    learning_rate: 0.001
    optimizer_name: adamw
    weight_decay: 0.0
    validation_ratio: 0.1
    test_ratio: 0.1
    device: cpu
    seed: 42
