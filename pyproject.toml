[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoencoders-benchmarking"
version = "0.1.0"
description = "Benchmarking framework for evaluating autoencoders-based embedding transforms on downstream tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "autoencoders>=0.6.8",
  "mteb>=2.15.3",
  "PyYAML>=6.0",
  "sentence-transformers>=5.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
