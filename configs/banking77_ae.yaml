experiment_name: banking77-v2-ae-latents

encoder:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 128
  normalize_embeddings: false

task:
  name: Banking77Classification.v2
  output_dir: results
  eval_splits: ["test"]
  max_fit_samples: 5000

transform:
  kind: autoencoder
  fit: true
  output_representation: latents
  batch_size: 512
  checkpoint_dir: results/banking77-v2-ae-latents/checkpoint
  model_name: ae
  model_config:
    latent_dim: 128
  encoder_name: mlp
  encoder_config:
    hidden_dims: [256]
    activation: relu
    use_bias: true
  decoder_name: mlp
  decoder_config:
    hidden_dims: [384]
    activation: relu
    use_bias: true
  training_config:
    output_dir: results/banking77-v2-ae-latents/train
    epochs: 0
    patience: 5
    batch_size: 256
    learning_rate: 0.001
    optimizer_name: adamw
    weight_decay: 0.0
    validation_ratio: 0.1
    test_ratio: 0.1
    device: cpu
    seed: 42
